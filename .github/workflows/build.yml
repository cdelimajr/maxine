# Awtomatikong gumagawa ng APK, Windows, macOS, Linux, iOS (unsigned) at web
# tuwing mag-push ka sa GitHub. Kunin ang mga file sa tab na "Actions" > pinakabagong run > "Artifacts".
name: Build Maxine

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: maxine-android-apk, path: build/app/outputs/flutter-apk/app-release.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with: { name: maxine-windows, path: build/windows/x64/runner/Release/ }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build macos --release
      - run: cd build/macos/Build/Products/Release && zip -r -y ../../../../../maxine-macos.zip maxine.app
      - uses: actions/upload-artifact@v4
        with: { name: maxine-macos, path: maxine-macos.zip }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # Walang signing: para ma-install sa iPhone, kailangan pa ring i-sign gamit ang Apple ID (tingnan ang BUILD.md).
      - run: flutter build ios --release --no-codesign
      - run: mkdir Payload && cp -r build/ios/iphoneos/Runner.app Payload/ && zip -r maxine-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: maxine-ios-unsigned, path: maxine-unsigned.ipa }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with: { name: maxine-linux, path: build/linux/x64/release/bundle/ }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with: { name: maxine-web, path: build/web/ }
