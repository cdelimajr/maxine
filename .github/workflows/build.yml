# Awtomatikong gumagawa ng APK, Windows, macOS, Linux, iOS (unsigned) at web
# tuwing mag-push ka sa GitHub. Kunin ang mga file sa tab na "Actions" > pinakabagong run > "Artifacts".
name: Build Maxine

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test
      # Permanenteng susi ng APK (GitHub secret) para gumana ang auto-update.
      - name: Ilagay ang signing key
        env: { MAXINE_KEYSTORE: '${{ secrets.MAXINE_KEYSTORE }}' }
        run: |
          if [ -n "$MAXINE_KEYSTORE" ]; then
            echo "$MAXINE_KEYSTORE" | base64 -d > android/app/maxine-release.jks
          else
            echo "::warning::Walang MAXINE_KEYSTORE secret; debug key ang gagamitin (hindi gagana ang auto-update sa Android)."
          fi
      - run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: maxine-android-apk, path: build/app/outputs/flutter-apk/app-release.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: maxine-windows, path: build/windows/x64/runner/Release/ }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build macos --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - run: cd build/macos/Build/Products/Release && zip -r -y ../../../../../maxine-macos.zip maxine.app
      - uses: actions/upload-artifact@v4
        with: { name: maxine-macos, path: maxine-macos.zip }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # Walang signing: para ma-install sa iPhone, kailangan pa ring i-sign gamit ang Apple ID (tingnan ang BUILD.md).
      - run: flutter build ios --release --no-codesign --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - run: mkdir Payload && cp -r build/ios/iphoneos/Runner.app Payload/ && zip -r maxine-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: maxine-ios-unsigned, path: maxine-unsigned.ipa }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build linux --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: maxine-linux, path: build/linux/x64/release/bundle/ }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build web --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: maxine-web, path: build/web/ }

  # Gumagawa ng GitHub Release (makikita sa "Releases" sa kanan ng repo page)
  # na may APK, Windows, Mac, Linux, iOS at web, para madaling i-download.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [android, windows, macos, ios, linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Ihanda ang mga file
        run: |
          mkdir out
          cp dl/maxine-android-apk/app-release.apk out/Maxine-Android.apk
          (cd dl/maxine-windows && zip -qr ../../out/Maxine-Windows.zip .)
          cp dl/maxine-macos/maxine-macos.zip out/Maxine-Mac.zip
          (cd dl/maxine-linux && zip -qr ../../out/Maxine-Linux.zip .)
          cp dl/maxine-ios-unsigned/maxine-unsigned.ipa out/Maxine-iOS-unsigned.ipa
          (cd dl/maxine-web && zip -qr ../../out/Maxine-Web.zip .)
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Maxine v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            ## I-download si Maxine
            - **Android phone:** `Maxine-Android.apk`. Buksan sa phone at payagan ang "Install unknown apps".
            - **Windows PC:** `Maxine-Windows.zip`. I-unzip, tapos buksan ang `maxine.exe`.
            - **Mac:** `Maxine-Mac.zip`
            - **Linux:** `Maxine-Linux.zip`
            - **iPhone:** `Maxine-iOS-unsigned.ipa` (kailangan pang i-sign, tingnan ang BUILD.md)

            Pagbabago: ${{ github.event.head_commit.message }}
          files: out/*
